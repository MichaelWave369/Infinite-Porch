name: Windows package repair diagnostic
on:
  push:
    branches: ['ci/porch-v0.1.2-windows-package-repair']
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37168990358
          name: porch-0.1.2-windows-native
          path: prior-native
      - name: Diagnose source field kit against unchanged prebuilt binaries
        env:
          PORCH_EVIDENCE_ROOT: diagnostic
        run: python tests/package_acceptance.py --archive (Get-ChildItem prior-native/packages/*.zip).FullName --field-kit-source field-kit/windows --out diagnostic/package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: porch-0.1.2-windows-package-repair-diagnostic
          retention-days: 30
          path: diagnostic/
