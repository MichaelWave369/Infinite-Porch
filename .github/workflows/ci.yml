name: Porch candidate gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_toolchain.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: python tests/cli_smoke.py
      - run: python tests/acceptance.py
      - run: python tests/qualification_acceptance.py
      - run: python tests/process_failures.py
      - run: python tests/process_failures.py --transport quic
      - run: python tests/transport_acceptance.py
      - run: python tests/limit_cli.py
      - run: python scripts/check_platform.py
      - run: npm audit --audit-level=high
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: python tests/ui_acceptance.py
      - run: python scripts/package.py
      - run: python tests/package_acceptance.py
      - if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          python scripts/audit_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: porch-${{ runner.os }}-candidate-evidence
          path: |
            docs/receipts/
            docs/evidence/
            dist/*.zip
