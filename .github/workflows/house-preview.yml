name: Infinite House visual prototype
on:
  pull_request:
    paths:
      - 'apps/house/**'
      - 'docs/INFINITE_HOUSE_INTEGRATION_V0_1.md'
      - '.github/workflows/house-preview.yml'
  workflow_dispatch:
jobs:
  visual-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated frontend dependencies
        run: npm install --prefix apps/house --no-audit --no-fund
      - name: Verify room manifest
        run: npm test --prefix apps/house
      - name: Typecheck and build standalone house
        run: npm run build --prefix apps/house
