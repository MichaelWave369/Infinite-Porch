[package]
name = "porch-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
porch-core = { path = "../porch-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
tokio.workspace = true
rand.workspace = true
uuid.workspace = true
clap.workspace = true
reqwest.workspace = true
libp2p = { version = "=0.56.0", features = ["tokio", "tcp", "noise", "yamux", "quic", "mdns", "identify", "ping", "kad", "request-response", "json", "macros", "autonat", "relay", "dcutr"] }
futures = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
axum = { version = "0.8", features = ["json", "tokio"] }
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
